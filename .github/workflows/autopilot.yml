name: Autopilot

# Runs every agent once a day, then commits state/ and reports/ back so the next run remembers.
on:
  schedule:
    - cron: "23 13 * * *"   # daily 13:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing to Etsy/Gumroad/Pinterest, save nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LibreOffice (renders listing images)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc poppler-utils fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Restore built products
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ hashFiles('scripts/build_planner.py', 'autopilot/images.py', 'autopilot.toml', 'state/state.json') }}
          restore-keys: dist-

      - name: Run agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}   # lets the Etsy agent save its rotated login token
        run: python -m autopilot daily ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state and reports
        if: always() && !inputs.dry_run
        run: |
          git config user.name "autopilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports
          git diff --cached --quiet || git commit -m "autopilot: daily run $(date -u +%F)"
          git push

      - name: Upload products and images (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products
          path: dist/
          retention-days: 14
